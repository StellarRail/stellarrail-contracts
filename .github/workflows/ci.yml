name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Install stellar-cli 27.1.0 (pinned binary)
        run: |
          curl -sSL -o /tmp/stellar-cli.tgz https://github.com/stellar/stellar-cli/releases/download/v27.1.0/stellar-cli-27.1.0-x86_64-unknown-linux-gnu.tar.gz
          mkdir -p /tmp/stellar-cli && tar -xzf /tmp/stellar-cli.tgz -C /tmp/stellar-cli
          sudo install /tmp/stellar-cli/stellar /usr/local/bin/stellar
          stellar --version
      - name: Build WASM (required by integration_sandbox at runtime)
        run: stellar contract build
      - run: cargo test --all-targets

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Install stellar-cli 27.1.0 (pinned binary)
        run: |
          curl -sSL -o /tmp/stellar-cli.tgz https://github.com/stellar/stellar-cli/releases/download/v27.1.0/stellar-cli-27.1.0-x86_64-unknown-linux-gnu.tar.gz
          mkdir -p /tmp/stellar-cli && tar -xzf /tmp/stellar-cli.tgz -C /tmp/stellar-cli
          sudo install /tmp/stellar-cli/stellar /usr/local/bin/stellar
          stellar --version
      - run: stellar contract build
      - name: Record hash
        run: |
          sha256sum target/wasm32v1-none/release/escrow.wasm | tee escrow.wasm.sha256
          ls -lh target/wasm32v1-none/release/escrow.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: escrow-wasm
          path: |
            target/wasm32v1-none/release/escrow.wasm
            escrow.wasm.sha256
